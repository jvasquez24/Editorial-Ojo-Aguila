<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ojo de Águila · Control de Ventas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦅</text></svg>">
<style>
:root{--bg:#FBF1DC;--card:#FFFBF1;--text:#4A2E1A;--muted:#8A6A4E;--accent:#A9743F;--accent-dark:#7A5230;--border:#E8D6B5;--ok:#3F7A48;--red:#C0392B;--red-dark:#96261B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.box{flex:1;min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 2px 6px rgba(120,80,40,.08)}
.box .n{font-size:1.25rem;font-weight:700}
.l{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;padding:12px;text-align:center;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:700;font-size:.92rem;box-shadow:0 2px 5px rgba(120,80,40,.08);transition:transform .1s}
.tab:active{transform:scale(.97)}
.tab.active{background:linear-gradient(135deg,#C08A50,#8A5A2F);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(138,90,47,.35)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(120,80,40,.08)}
label{display:block;font-size:.78rem;color:var(--muted);margin:8px 0 4px}
select,input{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:.95rem}
select:focus,input:focus{outline:2px solid #D9B98A;border-color:var(--accent)}
button{cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .15s,filter .15s}
button:active{transform:scale(.97)}
.addbtn{margin-top:14px;width:100%;padding:13px;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:1rem;letter-spacing:.2px;background:linear-gradient(135deg,#C89B63,#8A5A2F);box-shadow:0 4px 12px rgba(138,90,47,.4)}
.dlbtn{width:100%;padding:12px;margin-bottom:14px;color:#fff;border:none;border-radius:12px;font-weight:800;font-size:.92rem;background:linear-gradient(135deg,#D9503F,#A52A1E);box-shadow:0 4px 12px rgba(165,42,30,.35)}
.dlmini{color:#fff;border:none;border-radius:999px;padding:6px 11px;margin-right:10px;font-size:.75rem;font-weight:700;background:linear-gradient(135deg,#D9503F,#A52A1E);box-shadow:0 2px 6px rgba(165,42,30,.3)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.del{background:#FCE3DF;color:var(--red-dark);border:1px solid #F2B8B0;border-radius:999px;padding:6px 12px;font-size:.76rem;font-weight:700}
.del:active{background:#F7CBC4}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:.9rem}
.tot{font-weight:700;color:var(--ok)}
.section-title{font-weight:700;margin-bottom:6px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:10px}
.hist.cur{background:#FFF3D6;border:1px solid var(--accent)}
.right{display:flex;align-items:center}
.status{font-size:.75rem;text-align:center;margin-bottom:12px;padding:6px 10px;border-radius:8px}
.status.ok{color:var(--ok)}
.status.err{background:#fbe4e0;color:#8a2a1e}
.status.wait{color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(60,35,15,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal.show{display:flex}
.dialog{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:340px;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center}
.dialog .ico{font-size:2rem}
.dialog h3{margin:6px 0 6px;font-size:1.1rem}
.dialog p{margin:0 0 16px;color:var(--muted);font-size:.9rem;word-break:break-word}
.dialog .row{display:flex;gap:10px}
.dialog button{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:.95rem;border:none}
.btn-cancel{background:#F1E3C8;color:var(--accent-dark)}
.btn-danger{color:#fff;background:linear-gradient(135deg,#D9503F,#A52A1E);box-shadow:0 4px 10px rgba(165,42,30,.35)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#3F7A48;color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:.88rem;box-shadow:0 6px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s;max-width:92%;text-align:center;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.red{background:#A52A1E}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"><div class="dialog"><div class="ico">🗑️</div><h3 id="m-title"></h3><p id="m-detail"></p>
<div class="row"><button class="btn-cancel" id="m-cancel">Cancelar</button><button class="btn-danger" id="m-ok">Sí, eliminar</button></div></div></div>
<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, remove, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAptrvGUiHfH90lKaj2Eb26b3NEXP313jk",
  authDomain: "loteria-version-1.firebaseapp.com",
  databaseURL: "https://loteria-version-1.firebaseio.com",
  projectId: "loteria-version-1",
  storageBucket: "loteria-version-1.firebasestorage.app",
  messagingSenderId: "23006109590",
  appId: "1:23006109590:web:34806d0f1f8169ae3747b7"
};
const db = getDatabase(initializeApp(firebaseConfig));

// Ruta propia dentro de Realtime Database (para no mezclarse con otros datos del proyecto)
const C_BOOKS = "ojoaguila/libros";
const C_SERV = "ojoaguila/servicios";
const C_PLACES = "ojoaguila/lugares";

const BOOKS = [
  ["Léeme un Cuento",8000],["Viaje Mágico al Mundo del Saber",10000],["No Regreses Jamás",7000],
  ["13 Portales de Terror",10000],["Susúrralo Tres Veces",10000],["Historias Jamás Contadas",6000],
  ["Daño Colateral",7000],["Tienda de Antigüedades Altergott",10000],["La Nota Perdida",10000],
  ["Diario de un Nuevo Amanecer",7000],["Mutilados por los Dioses",7000],["Siete Vidas para Salvar Una",6000],
  ["El Diario de una Muñeca de Trapo",8000],["Cartas de un Amor Desconocido",7000],["Memorias de la Infancia",8000],
  ["Y Elegimos Sanar Juntos",8000],["Un Héroe Anónimo",8000],["Lo que Fui Antes de Irme",8000],
  ["Entre el Espanto y la Ternura",10000],["En la Intimidad del Ser",10000]
];
const SERVICES = [
  ["Corrección de Estilo",0],["Corrección Filológica",0],["Diagramación Profesional",0],["Diseño de Portada",0],
  ["Registro ISBN",0],["Derechos de Autor (asesoría)",0],["Impresión",0],["Promoción y Lanzamiento",0],
  ["Taller El Arte de Escribir (mes)",25000],["Taller de Derechos de Autor",20000],["Taller de Inteligencia Emocional",30000]
];

const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const fmt = n => "₡" + Number(n).toLocaleString("es-CR");
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const opts = list => list.map((x,i)=>`<option value="${i}">${esc(x[0])} — ${x[1]?fmt(x[1]):"precio libre"}</option>`).join("");

const S = { sel: todayStr(), tab: "libros", books: [], servs: [], places: {}, status: "wait" };

function listen(path, apply) {
  onValue(ref(db, path), snap => {
    apply(snap.val() || {});
    S.status = "ok"; render();
  }, err => { S.status = "err:" + (err.code || err.message); render(); });
}
const toList = o => Object.entries(o).map(([id, x]) => ({ id, ...x })).sort((a,b)=>(a.ts||0)-(b.ts||0));
listen(C_BOOKS, o => S.books = toList(o));
listen(C_SERV, o => S.servs = toList(o));
listen(C_PLACES, o => S.places = o);

const inDate = l => l.filter(r => r.date === S.sel);
const sumB = l => l.reduce((s,r)=>s+r.qty*r.price,0);
const sumS = l => l.reduce((s,r)=>s+r.price,0);
function allDates() {
  const d = { [S.sel]: 1 };
  S.books.concat(S.servs).forEach(r => d[r.date] = 1);
  Object.keys(S.places).forEach(k => d[k] = 1);
  return Object.keys(d).sort().reverse();
}
const dayTotal = dt => sumB(S.books.filter(r=>r.date===dt)) + sumS(S.servs.filter(r=>r.date===dt));

function render() {
  const app = document.getElementById("app");
  const keep = {};
  app.querySelectorAll("input[id],select[id]").forEach(e => keep[e.id] = e.value);

  const bs = inDate(S.books), ss = inDate(S.servs);
  const tb = sumB(bs), ts = sumS(ss);
  const grand = sumB(S.books) + sumS(S.servs);
  const place = S.places[S.sel] || "";
  let h = `<h1>🦅 Editorial Ojo de Águila</h1><p class="sub">Control de ventas por fecha y lugar</p>`;

  if (S.status === "ok") h += `<div class="status ok">● Conectado a Firebase</div>`;
  else if (S.status === "wait") h += `<div class="status wait">Conectando a Firebase…</div>`;
  else h += `<div class="status err">No se pudo conectar a Firebase (${esc(S.status.slice(4))}). Revisa que las reglas de Realtime Database permitan leer y escribir en la ruta ojoaguila.</div>`;

  h += `<div class="card"><div class="section-title">1. Elige la fecha de venta</div>
    <label>Fecha</label><input id="sel-date" type="date" value="${esc(S.sel)}" onchange="pickDate(this.value)">
    <label>Lugar de esta fecha (feria, evento, tienda...)</label>
    <input id="sel-place" type="text" list="places-list" value="${esc(place)}" placeholder="Ej: Feria del Libro" onchange="setPlace(this.value)">
    <datalist id="places-list">${[...new Set(Object.values(S.places).filter(Boolean))].map(p=>`<option value="${esc(p)}">`).join("")}</datalist></div>`;

  h += `<div class="summary">
    <div class="box"><div class="n">${fmt(tb)}</div><div class="l">Libros (este día)</div></div>
    <div class="box"><div class="n">${fmt(ts)}</div><div class="l">Servicios (este día)</div></div>
    <div class="box"><div class="n">${fmt(tb+ts)}</div><div class="l">Total del día</div></div></div>
    <button class="dlbtn" onclick="dlDay('${esc(S.sel)}', event)">⬇ Descargar este día en Excel (${esc(S.sel)})</button>
    <div class="tabs">
      <div class="tab ${S.tab!=="serv"?"active":""}" onclick="setTab('libros')">📚 Libros</div>
      <div class="tab ${S.tab==="serv"?"active":""}" onclick="setTab('serv')">🛠️ Servicios</div></div>`;

  h += `<div class="panel ${S.tab!=="serv"?"active":""}">
    <div class="card"><div class="section-title">2. Nueva venta de libro</div>
      <label>Libro</label><select id="b-book">${opts(BOOKS)}</select>
      <label>Cantidad</label><input id="b-qty" type="number" min="1" value="1">
      <label>Comprador (opcional)</label><input id="b-buyer" type="text" placeholder="Nombre">
      <button class="addbtn" onclick="addBook()">➕ Agregar venta</button></div>
    <div class="card"><div class="tablewrap">`;
  if (!bs.length) h += `<div class="empty">No hay ventas de libros en esta fecha.</div>`;
  else {
    h += `<table><tr><th>Libro</th><th>Cant.</th><th>Subtotal</th><th>Comprador</th><th></th></tr>`;
    bs.slice().reverse().forEach(r => h += `<tr><td>${esc(r.book)}</td><td>${r.qty}</td><td class="tot">${fmt(r.qty*r.price)}</td><td>${esc(r.buyer||"—")}</td><td><button class="del" onclick="delItem('${C_BOOKS}','${r.id}')">🗑 Eliminar</button></td></tr>`);
    h += `</table>`;
  }
  h += `</div></div></div>`;

  h += `<div class="panel ${S.tab==="serv"?"active":""}">
    <div class="card"><div class="section-title">2. Nuevo servicio vendido</div>
      <label>Servicio</label><select id="s-serv" onchange="fillPrice()">${opts(SERVICES)}</select>
      <label>Precio (₡)</label><input id="s-price" type="number" min="0" value="0">
      <label>Cliente</label><input id="s-client" type="text" placeholder="Nombre">
      <button class="addbtn" onclick="addServ()">➕ Agregar servicio</button></div>
    <div class="card"><div class="tablewrap">`;
  if (!ss.length) h += `<div class="empty">No hay servicios en esta fecha.</div>`;
  else {
    h += `<table><tr><th>Servicio</th><th>Precio</th><th>Cliente</th><th></th></tr>`;
    ss.slice().reverse().forEach(r => h += `<tr><td>${esc(r.service)}</td><td class="tot">${fmt(r.price)}</td><td>${esc(r.client||"—")}</td><td><button class="del" onclick="delItem('${C_SERV}','${r.id}')">🗑 Eliminar</button></td></tr>`);
    h += `</table>`;
  }
  h += `</div></div></div>`;

  h += `<div class="card"><div class="section-title">Historial por fecha</div>`;
  allDates().forEach(dt => h += `<div class="hist ${dt===S.sel?"cur":""}" onclick="pickDate('${dt}')">
      <div><b>${esc(dt)}</b><div class="l">${esc(S.places[dt]||"Sin lugar")}</div></div>
      <div class="right"><button class="dlmini" onclick="dlDay('${dt}', event)">⬇ Excel</button><div class="tot">${fmt(dayTotal(dt))}</div></div></div>`);
  h += `<div class="hist"><div><b>Total acumulado</b></div><div class="tot">${fmt(grand)}</div></div>
    <button class="dlbtn" style="margin:10px 0 0" onclick="dlDay(null, event)">⬇ Descargar todo el historial en Excel</button></div>`;

  app.innerHTML = h;
  Object.keys(keep).forEach(id => { const e = document.getElementById(id); if (e && id !== "sel-date") e.value = keep[id]; });
}

const fail = e => alert("No se pudo guardar: " + (e.code || e.message));
const $ = id => document.getElementById(id);

function confirmDialog(title, detail, okText) {
  return new Promise(res => {
    const m = $("modal");
    $("m-title").textContent = title;
    $("m-detail").textContent = detail || "";
    $("m-ok").textContent = okText || "Sí, eliminar";
    m.classList.add("show");
    const done = v => { m.classList.remove("show"); m.onclick = $("m-ok").onclick = $("m-cancel").onclick = null; res(v); };
    $("m-ok").onclick = () => done(true);
    $("m-cancel").onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
  });
}
let toastTimer;
function toast(msg, red) {
  const t = $("toast");
  t.textContent = msg; t.className = "show" + (red ? " red" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, 2800);
}

window.setTab = t => { S.tab = t; render(); if (t === "serv") fillPrice(); };
window.pickDate = d => { if (d) { S.sel = d; render(); } };
window.fillPrice = () => { $("s-price").value = SERVICES[$("s-serv").value][1]; };
window.setPlace = async v => {
  try { await set(ref(db, C_PLACES + "/" + S.sel), v.trim()); toast("📍 Lugar guardado"); } catch (e) { fail(e); }
};
window.addBook = async () => {
  const i = $("b-book").value;
  const rec = { book: BOOKS[i][0], price: BOOKS[i][1], qty: parseInt($("b-qty").value,10) || 1,
                buyer: $("b-buyer").value.trim(), date: S.sel, ts: Date.now() };
  try { await push(ref(db, C_BOOKS), rec); $("b-buyer").value = ""; $("b-qty").value = 1; toast("✅ Venta registrada: " + rec.qty + " × " + rec.book + " (" + fmt(rec.qty*rec.price) + ")"); } catch (e) { fail(e); }
};
window.addServ = async () => {
  const i = $("s-serv").value;
  const rec = { service: SERVICES[i][0], price: parseInt($("s-price").value,10) || 0,
                client: $("s-client").value.trim(), date: S.sel, ts: Date.now() };
  try { await push(ref(db, C_SERV), rec); $("s-client").value = ""; toast("✅ Servicio registrado: " + rec.service + " (" + fmt(rec.price) + ")"); } catch (e) { fail(e); }
};
window.delItem = async (col, id) => {
  const rec = (col === C_BOOKS ? S.books : S.servs).find(r => r.id === id);
  const detail = !rec ? "" : (col === C_BOOKS
    ? rec.qty + " × " + rec.book + " — " + fmt(rec.qty*rec.price) + " (" + rec.date + ")"
    : rec.service + " — " + fmt(rec.price) + " (" + rec.date + ")");
  if (!(await confirmDialog("¿Eliminar este registro?", detail))) return;
  try { await remove(ref(db, col + "/" + id)); toast("🗑 Registro eliminado", true); } catch (e) { fail(e); }
};

// ---------- Excel ----------
function dayData(d) {
  const pl = S.places[d] || "";
  const rows = [];
  S.books.filter(r=>r.date===d).forEach(r => rows.push([d,pl,"Libro",r.book,r.qty,r.price,r.qty*r.price,r.buyer||""]));
  S.servs.filter(r=>r.date===d).forEach(r => rows.push([d,pl,"Servicio",r.service,1,r.price,r.price,r.client||""]));
  return { rows, tb: sumB(S.books.filter(r=>r.date===d)), ts: sumS(S.servs.filter(r=>r.date===d)), place: pl };
}
function daySheet(d) {
  const x = dayData(d);
  const aoa = [["Fecha","Lugar","Tipo","Detalle","Cantidad","Precio unitario (₡)","Subtotal (₡)","Comprador/Cliente"], ...x.rows, [],
    ["","","","","","Total libros",x.tb,""],["","","","","","Total servicios",x.ts,""],["","","","","","TOTAL DEL DÍA",x.tb+x.ts,""]];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [12,22,10,36,9,18,14,22].map(wch => ({ wch }));
  return { ws, x };
}
window.dlDay = (dt, ev) => {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  if (typeof XLSX === "undefined") { alert("No se pudo cargar el generador de Excel. Revisa tu conexión."); return; }
  const wb = XLSX.utils.book_new();
  let count = 0;
  if (dt) {
    const one = daySheet(dt); count = one.x.rows.length;
    XLSX.utils.book_append_sheet(wb, one.ws, "Ventas " + dt);
  } else {
    const res = [["Fecha","Lugar","Libros (₡)","Servicios (₡)","Total (₡)"]];
    let tb = 0, ts = 0; const sheets = [];
    allDates().slice().reverse().forEach(d => {
      const sh = daySheet(d); if (!sh.x.rows.length) return;
      count += sh.x.rows.length; tb += sh.x.tb; ts += sh.x.ts;
      res.push([d, sh.x.place, sh.x.tb, sh.x.ts, sh.x.tb+sh.x.ts]); sheets.push([d, sh.ws]);
    });
    res.push([], ["","TOTAL ACUMULADO",tb,ts,tb+ts]);
    const wr = XLSX.utils.aoa_to_sheet(res);
    wr["!cols"] = [12,24,14,14,14].map(wch => ({ wch }));
    XLSX.utils.book_append_sheet(wb, wr, "Resumen");
    sheets.forEach(p => XLSX.utils.book_append_sheet(wb, p[1], p[0]));
  }
  if (!count) { alert("No hay ventas para descargar en esta selección."); return; }
  XLSX.writeFile(wb, dt ? `ventas-${dt}.xlsx` : "ventas-historial-completo.xlsx");
};

render();
</script>
</body>
</html>
